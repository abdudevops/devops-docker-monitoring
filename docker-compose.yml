

services:

  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend    

  frontend:
    build: ./frontend

  db:
    image: mongo
    ports:
      - "27017:27017"

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    depends_on:
      - db     

  prometheus:
    image: prom/prometheus
    volumes:
     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
     - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
     - "3001:3000"

  node-exporter:
    image: prom/node-exporter
    ports:
     - "9100:9100"
